<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">
        <div class="left">
            <h5>Search Users By Firstname Or By Last Name</h5>
            <div class="search">
                <div class="input-group">
                    <span class="input-group-text">First and last name</span>
                    <input type="text" aria-label="First name" class="form-control firsName" placeholder="Enter First">
                    <input type="text" aria-label="Last name" class="form-control last" placeholder="Enter second">
                </div>
                <button type="button" class="btn btn-outline-primary search">Search</button>
            </div>
            <h3>Result show</h3>
            <div class="result">
                <div class="card mb-3 card-style" style="max-width: 650px;">
                    <div class="row g-0">
                        <div class="col-md-4 pic-style rounded-start">
                            <img src="WhatsApp Image 2026-07-15 at 7.29.53 AM (1).jpeg" class="img-fluid " alt="pic">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <div class="about">
                                    <h5 class="card-title">Code With Jack</h5>
                                    <span class="badge rounded-pill">Web Developer</span>
                                </div>
                                <p>This is a wider card with supporting text below as a natural lead-in to
                                    additional content. This content is a little bit longer.</p>
                                <div class="btns">
                                    <button type="button" class="btn btn-primary btn-style"> <i
                                            class="fa-solid fa-envelope"></i>
                                        Connect</button>
                                    <button type="button" class="btn btn-outline-primary btn-style"><i
                                            class="fa-solid fa-user-plus"></i> Follow</button>
                                </div>
                                <hr>
                                <div class="find">
                                    <div class="social">
                                        <i class="fa-brands fa-twitter"></i>
                                        <i class="fa-brands fa-facebook"></i>
                                        <i class="fa-brands fa-linkedin"></i>
                                    </div>
                                    <div class="address">
                                        <p>
                                            <i class="fa-solid fa-location-dot"></i> New York , America
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="user-list">
                <button type="button" class="btn btn-outline-primary load">Load User</button>
                <br><br>
                <p class="loading"></p>
                <div class="lists">
                    <ul class="list-group firstName">
                        <li class="list-group-item active" aria-current="true">First Name</li>
                        <!-- <li class="list-group-item">Jahanzaib <button class="copybtn"><i class="fa-regular fa-clipboard"></i></button> </li> -->
                    </ul>
                    <ul class="list-group lastName">
                        <li class="list-group-item active" aria-current="true">Last Name </li>
                        <!-- <li class="list-group-item">Channar <button class="copybtn"><i class="fa-regular fa-clipboard"></i></button></li> -->
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <!-- Card  -->


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>

</body>

</html>
